# Application Configuration
spring.application.name=hotel-revenue-analytics-api
server.port=8080

# Database Configuration using Environment Variables with Fallback to H2 in-memory DB for local run
spring.datasource.url=${DB_URL:jdbc:h2:mem:hotel_analytics_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Defer SQL script execution until Hibernate DDL schema is created
spring.jpa.defer-datasource-initialization=true

# H2 Console (available at /h2-console when running in H2 mode)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Sample Development Data Seeding (Set to false or run with --spring.profiles.active=prod in production)
app.data.seed.enabled=${APP_SEED_ENABLED:true}
spring.sql.init.mode=never

# OpenAPI Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
